services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: taxi_app
    ports:
      - "3306:3306"
    volumes:
      - taxi_mysql_data:/var/lib/mysql
      - ./sql/cloud:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql"]
      interval: 8s
      timeout: 5s
      retries: 12

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taxi_app
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      JWT_SECRET: cambia-esta-clave-en-la-nube-minimo-32-caracteres
      APP_SECURITY_BETA_OPEN: "true"
      PORT: "8080"

volumes:
  taxi_mysql_data:
