<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="menu(activa)">
  <input type="checkbox" id="nav-abierto" class="nav-abierto" autocomplete="off">
  <header class="topbar">
    <label for="nav-abierto" class="nav-boton" aria-label="Abrir menú">☰</label>
    <span class="brand-mini">RapiTrip</span>
  </header>
  <label for="nav-abierto" class="nav-fondo" aria-hidden="true"></label>
  <aside class="sidebar">
    <div class="marca-fila">
      <div class="marca-marca">R</div>
      <div>
        <p class="brand">RapiTrip</p>
        <p class="brand-sub">Administración</p>
      </div>
    </div>
    <nav class="nav">
      <a th:href="@{/admin}" th:classappend="${activa == ''} ? 'activo'">Inicio</a>
      <p class="nav-grupo">Operación</p>
      <a th:each="t : ${tablas}" th:if="${#lists.contains({'usuario','conductor','vehiculo','tarifa','viaje','ubicacion'}, t.clave)}"
         th:href="@{|/admin/${t.clave}|}" th:text="${t.titulo}" th:classappend="${activa == t.clave} ? 'activo'"></a>
      <p class="nav-grupo">Pagos</p>
      <a th:each="t : ${tablas}" th:if="${#lists.contains({'pago','metodo_pago'}, t.clave)}"
         th:href="@{|/admin/${t.clave}|}" th:text="${t.titulo}" th:classappend="${activa == t.clave} ? 'activo'"></a>
      <p class="nav-grupo">Actividad</p>
      <a th:each="t : ${tablas}" th:if="${#lists.contains({'calificacion','mensajes_viaje','dispositivo_push'}, t.clave)}"
         th:href="@{|/admin/${t.clave}|}" th:text="${t.titulo}" th:classappend="${activa == t.clave} ? 'activo'"></a>
      <p class="nav-grupo">Registro</p>
      <a th:each="t : ${tablas}" th:if="${#lists.contains({'padron_dni','padron_licencia','padron_soat','verificacion_conductor','test_pregunta','test_intento','test_bloqueo'}, t.clave)}"
         th:href="@{|/admin/${t.clave}|}" th:text="${t.titulo}" th:classappend="${activa == t.clave} ? 'activo'"></a>
      <th:block th:each="t : ${tablas}" th:if="${!#lists.contains({'usuario','conductor','vehiculo','tarifa','viaje','ubicacion','pago','metodo_pago','calificacion','mensajes_viaje','dispositivo_push','padron_dni','padron_licencia','padron_soat','verificacion_conductor','test_pregunta','test_intento','test_bloqueo'}, t.clave)}">
        <a th:href="@{|/admin/${t.clave}|}" th:text="${t.titulo}" th:classappend="${activa == t.clave} ? 'activo'"></a>
      </th:block>
    </nav>
    <form th:action="@{/admin/logout}" method="post" class="logout-form">
      <button class="logout" type="submit">Cerrar sesión</button>
    </form>
  </aside>
</th:block>
</body>
</html>
